server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 256m;

    # Network deployments authenticate the entire app, including attachment URLs.
    auth_basic "Bemo";
    auth_basic_user_file /etc/nginx/bemo.htpasswd;

    # Sync clients use Bearer auth, verified by the backend on every sync route.
    # Do not require two competing Authorization headers on the same request.
    location /api/sync/ {
        auth_basic off;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /images/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
